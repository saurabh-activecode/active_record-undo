AllCops:
  NewCops: enable
  SuggestExtensions: false
  Exclude:
    - 'bin/**/*'
    - 'db/schema.rb'
    - 'spec/internal/**/*'
    - 'vendor/**/*'

Style/Documentation:
  Enabled: false

Style/FrozenStringLiteralComment:
  Enabled: true

Layout/LineLength:
  Max: 120

Gemspec/DevelopmentDependencies:
  Enabled: false

Metrics/BlockLength:
  Exclude:
    - 'spec/**/*'
    - 'active_record-undo.gemspec'

Naming/VariableNumber:
  Enabled: false

Metrics/MethodLength:
  Max: 10

Metrics/AbcSize:
  Max: 15

Metrics/CyclomaticComplexity:
  Max: 7
  Exclude:
    - 'db/migrate/**/*'

Metrics/PerceivedComplexity:
  Max: 7
  Exclude:
    - 'db/migrate/**/*'

name: "Rubocop"

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  schedule:
    - cron: '30 20 * * 6'

jobs:
  rubocop:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true

      - name: Install Code Scanning integration
        run: bundle add code-scanning-rubocop --version "~> 0.6" --skip-install

      - name: Install dependencies
        run: bundle install

      - name: Rubocop run
        run: |
          bundle exec rubocop --require code_scanning --format CodeScanning::SarifFormatter -o rubocop.sarif || true

      - name: Upload Sarif output
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: rubocop.sarif

name: Ruby Gem

on:
  pull_request:
    types: [closed]
    branches: [ "master" ]

jobs:
  build:
    name: Build + Publish
    # Only run if the PR was actually merged (not closed without merging)
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Ruby 3.4
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true

      - name: Publish to RubyGems
        uses: rubygems/release-gem@v1

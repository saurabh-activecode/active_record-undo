# .github/workflows/publish_gem.yml
name: Release Gem

on:
  release:
    types: [published]
  push:
    tags:
      - 'v*'

jobs:
  publish:
    name: Build & Publish Gem
    runs-on: ubuntu-latest
    
    # Required for OIDC authentication with RubyGems.org
    permissions:
      contents: read
      id-token: write

    environment: rubygems # Matches environment name configured on RubyGems.org

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: actions/setup-ruby@v4
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Build Gem
        run: |
          gem build *.gemspec

      - name: Publish to RubyGems via OIDC
        uses: rubygems/configure-rubygems-credentials@v1
        with:
          # Automatically uses OpenID Connect token from GitHub Actions
          role-to-assume: rubygems-publisher

      - name: Push Gem to RubyGems
        run: |
          gem push *.gem
